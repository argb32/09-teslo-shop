<div class=" card card-sm bg-base-100 shadow-xl animate-fadeIn">
  <figure>
    <img [src]="imageUrl()" alt="{{product().title}}" />
  </figure>
  <div class="card-body">
    <h2 class="card-title font-montserrat text-lg text-accent">{{product().title}}</h2>
    <p>{{product().description | slice:0:70 }}...</p>
    <div class="card-actions justify-end">
      <a class="link link-accent " [routerLink]="['/product', product().slug]">Ver más</a>
    </div>
  </div>
</div>
